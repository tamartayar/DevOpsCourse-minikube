name: Build and Push to GCR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # הזדהות מול Google Cloud בעזרת Service Account JSON ששמור כ-Secret בגיטהאב
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1

    # הגדרת דוקר לעבוד עם GCR
    - name: Configure Docker
      run: gcloud auth configure-docker gcr.io --quiet

    # בניית האימג' והעלאה ישירות ל-GCR
    - name: Build and Push Docker Image
      run: |
        docker build -t gcr.io/my-gcp-project/my-python-app:latest .
        docker push gcr.io/my-gcp-project/my-python-app:latest