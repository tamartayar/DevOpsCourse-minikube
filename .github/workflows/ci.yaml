name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # הזדהות מול GitHub Container Registry
    - name: Log in to the Container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # בניית האימג' והעלאה ל-GHCR
    - name: Build and Push Docker Image
      run: |
        # שם ה-Image חייב להכיל את שם המשתמש/הארגון בגיטהאב
        docker build -t ghcr.io/USERNAME/my-python-app:latest .
        docker push ghcr.io/USERNAME/my-python-app:latest